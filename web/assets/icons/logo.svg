<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="omni-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="resume-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="omni-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo Orbit -->
  <circle cx="32" cy="32" r="28" fill="#1e1b4b" fill-opacity="0.3" stroke="url(#omni-grad-1)" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Document Base Layer (OmniDoc) -->
  <path d="M16 10C13.7909 10 12 11.7909 12 14V50C12 52.2091 13.7909 54 16 54H42C44.2091 54 46 52.2091 46 50V22L34 10H16Z" fill="#0d111a" stroke="url(#omni-grad-1)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Document Fold Corner -->
  <path d="M34 10V20C34 21.1046 34.8954 22 36 22H46" stroke="url(#omni-grad-1)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Front Layer / Resume Card Badge -->
  <rect x="24" y="24" width="28" height="34" rx="4" fill="#131826" stroke="url(#resume-grad)" stroke-width="2" />
  
  <!-- Resume Elements -->
  <!-- Candidate Avatar icon on resume -->
  <circle cx="32" cy="32" r="3.5" fill="url(#resume-grad)" />
  <!-- Resume lines -->
  <line x1="39" y1="30" x2="47" y2="30" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="39" y1="34" x2="45" y2="34" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="41" x2="48" y2="41" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="46" x2="48" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="51" x2="41" y2="51" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

  <!-- AI Sparkle / Omni Node at Top-Right -->
  <g filter="url(#omni-glow)">
    <path d="M48 6L49.5 11L54.5 12.5L49.5 14L48 19L46.5 14L41.5 12.5L46.5 11L48 6Z" fill="#38bdf8" />
    <circle cx="48" cy="12.5" r="1.5" fill="#ffffff" />
  </g>
</svg>
