name: pdf_assist_mobile
description: "AI PDF Assistant — Production Flutter Mobile App with RAG and Page Citations"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Storage
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # PDF & Files
  file_picker: ^8.0.5
  syncfusion_flutter_pdfviewer: ^33.2.13

  # UI & Design
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
